<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>정치와 법 암기 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#16212C; --muted:#566676; --line:#D3DAE2;
  --accent:#1F3B63; --on-accent:#FFFFFF; --hover:#E6ECF4;
  --good:#17714D; --good-bg:#E2F2EA; --bad:#AD3029; --bad-bg:#FBE8E6;
  --font-display:'Gowun Batang','Noto Serif KR',serif;
  --font-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F161D; --surface:#17212B; --ink:#E8EEF4; --muted:#93A3B3; --line:#2A3844;
    --accent:#8FB4E8; --on-accent:#0F161D; --hover:#1F2D3A;
    --good:#5CC59A; --good-bg:#12302A; --bad:#F08A80; --bad-bg:#3A1D1B; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:28px}
h2{font-size:19px}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:18px}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.ch:last-child{border-bottom:0}
.ch:hover{background:var(--hover)}
.ch input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.ch-t{font-weight:500}
.ch-n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:2 / 4;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{font:inherit;font-weight:500;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 16px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 16px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-bottom:10px;font-variant-numeric:tabular-nums}
.qmeta b{color:var(--accent);font-weight:700;font-size:13px}
.q{font-family:var(--font-display);font-size:18px;line-height:1.6;margin:0 0 14px;white-space:pre-line}
.step+.step{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line)}
.opts{display:grid;gap:8px;grid-template-columns:1fr}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:grid;grid-template-columns:1.6em minmax(0,1fr) auto;gap:8px;align-items:start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-height:44px}
.opt:hover:not([disabled]){background:var(--hover)}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt .tag{font-size:12px;font-weight:700;white-space:nowrap}
.opt.good .tag{color:var(--good)}
.opt.bad .tag{color:var(--bad)}
.ans-in{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
.fb{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.6}
.fb.good{background:var(--good-bg);color:var(--ink);border:1px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.fb b{font-weight:700}
.fb .v{display:block;margin-top:2px}
.note{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--hover);font-size:14px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin-top:10px}
.big{font-family:var(--font-display);font-size:44px;line-height:1.1;font-variant-numeric:tabular-nums}
.wr{padding:12px 16px;border-bottom:1px solid var(--line)}
.wr:last-child{border-bottom:0}
.wr .wq{font-weight:500;white-space:pre-line}
.wr .wa{font-size:14px;color:var(--muted);margin-top:4px}
.flip{width:100%;min-height:220px;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px;cursor:pointer;display:flex;flex-direction:column;gap:10px}
.flip .side{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.flip .txt{font-family:var(--font-display);font-size:19px;line-height:1.65;white-space:pre-line}
.flip.back{border-color:var(--accent)}
.flip.back .txt{font-family:var(--font-body);font-size:16px}
@media (max-width:480px){.opts.two{grid-template-columns:1fr}h1{font-size:24px}}
</style></head>
<body><div class="wrap"><div id="app"></div></div>
<script>
const Q = [];
const CH = {
  A: '정치와 법의 이념',
  B: '기본권의 종류',
  C: '기본권의 제한',
  D: '형법과 죄형 법정주의',
  E: '범죄의 성립과 판단',
  F: '형벌과 보안 처분',
  G: '형사 절차와 인권'
};
const st = (q, opts, ans, fixed) => ({ t: 'mc', q, opts, ans, fixed: !!fixed });
const sh = (q, ans, m) => ({ t: 'sa', q, ans, any: (m && m.any) || null, all: (m && m.all) || null });
function mc(ch, q, opts, ans, exp, fixed) { Q.push({ ch, exp: exp || '', steps: [st(q, opts, ans, fixed)] }); }
function sa(ch, q, ans, m, exp) { Q.push({ ch, exp: exp || '', steps: [sh(q, ans, m)] }); }
function chain(ch, steps, exp) { Q.push({ ch, exp: exp || '', steps }); }

const R6 = ['행복추구권', '평등권', '자유권', '참정권', '청구권', '사회권'];
const FEAT = {
  '행복추구권': '포괄적 성격: 모든 기본권의 전제',
  '평등권': '상대적·실질적 평등: 합리적 차별 가능',
  '자유권': '소극적·방어적 권리',
  '참정권': '능동적·정치적 기본권',
  '청구권': '수단적·절차적 권리',
  '사회권': '적극적·현대적 권리'
};
const FEAT_LIST = R6.map(r => FEAT[r]);
const PRINCIPLES = ['성문 법률주의', '명확성의 원칙', '소급효 금지의 원칙', '유추해석 금지의 원칙', '적정성의 원칙'];
const RESULT = ['유죄', '무죄 (구성요건 해당성 없음)', '무죄 (위법성 조각)', '무죄 (책임 조각)'];

/* ===== A. 정치와 법의 이념 ===== */
sa('A', '정치란 무엇인가? (국가·집단 수준의 정의)',
  '국가 또는 집단 수준에서 나타나는 사회적 갈등과 대립을 조정하여 합의시키는 과정',
  { any: ['갈등', '대립', '합의'] });
sa('A', '좁은 의미의 정치란?',
  '정치권력의 획득·유지·행사 과정에서 공동체의 목표를 추구하고 정책을 결정하며 사회 질서를 확립하는 일',
  { any: ['정치권력', '권력'] }, '예: 대통령의 국정 운영, 국회의원의 입법 활동');
sa('A', '넓은 의미의 정치란?',
  '국가, 개인, 집단 등 사회 구성원 간의 이해관계나 갈등을 합리적으로 조정하고 해결하는 과정',
  { any: ['이해관계', '갈등'] });
mc('A', '다음 중 좁은 의미의 정치에 해당하는 것은?',
  ['국회의원의 입법 활동', '동아리 안에서 의견 차이를 조율하는 일', '가족끼리 용돈 문제를 합의하는 일', '친구 사이의 다툼을 화해시키는 일'],
  '국회의원의 입법 활동', '좁은 의미는 정치권력과 관련된 활동입니다. 나머지는 넓은 의미의 정치에 해당합니다.');

sa('A', '법의 이념 3가지를 모두 쓰시오.', '정의, 합목적성, 법적 안정성',
  { all: ['정의', '합목적성', '법적안정성'] });
mc('A', '"모든 사람에게 각자의 정당한 몫을 주는 것"에 해당하는 법의 이념은?',
  ['정의', '합목적성', '법적 안정성'], '정의', '', true);
mc('A', '"한 사회의 법질서는 그 사회가 지향하는 가치관에 부합하도록 실현되어야 한다"에 해당하는 법의 이념은?',
  ['정의', '합목적성', '법적 안정성'], '합목적성', '', true);
mc('A', '"사회생활이 법에 의해 보호되어 안정된 상태를 이루는 것"에 해당하는 법의 이념은?',
  ['정의', '합목적성', '법적 안정성'], '법적 안정성', '', true);

sa('A', '사회계약설의 핵심 내용은?',
  '자유롭고 평등한 개인들의 합리적인 합의(계약)에 의해 국가와 사회 권력이 성립된다.',
  { any: ['합의', '계약'] });
mc('A', '국민이 주권을 군주에게 양도하여 생명과 안전을 보장받는다고 본 사상가는?',
  ['홉스', '로크', '루소'], '홉스', '홉스: 전부 양도', true);
mc('A', '개인의 생명·자유·재산 보호는 정부의 임무이며 주권은 정부에 일부 위임한다고 본 사상가는?',
  ['홉스', '로크', '루소'], '로크', '로크: 일부 위임', true);
mc('A', '국민 주권과 직접 민주주의 정치를 실현해야 하며 주권은 양도할 수 없다고 본 사상가는?',
  ['홉스', '로크', '루소'], '루소', '루소: 양도 불가', true);
mc('A', '주권 양도 방식이 "전부 양도"인 사상가와 그 방식이 올바르게 짝지어진 것은?',
  ['홉스 – 전부 양도', '로크 – 전부 양도', '루소 – 전부 양도', '로크 – 양도 불가'],
  '홉스 – 전부 양도', '홉스 전부 양도, 로크 일부 위임, 루소 양도 불가');
sa('A', '다음 문장이 나타내는 헌법 원리는?\n"대한민국은 민주 공화국이다. 대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다."',
  '국민 주권주의', { any: ['국민주권', '국민주권주의'] });
sa('A', '자유 민주주의의 조건을 채우시오. "자율과 조화를 바탕으로, 활동이 ( )이어야 하며"', '민주적',
  { any: ['민주'] });

/* ===== C. 기본권의 제한 ===== */
sa('C', '기본권을 제한할 수 있는 목적 3가지를 쓰시오.', '국가 안전 보장, 질서 유지, 공공복리',
  { all: ['안전보장', '질서유지', '공공복리'] });
mc('C', '기본권을 제한하는 형식으로 옳은 것은?',
  ['국회에서 제정한 법률', '행정부의 시행령', '지방자치단체의 조례', '정부 부처의 내부 규칙'],
  '국회에서 제정한 법률', '기본권 제한은 법률로 해야 합니다.');
mc('C', '기본권이 예외적으로 법률 없이 계엄이나 긴급 명령으로 제한될 수 있는 경우는?',
  ['국가 비상사태', '정기 국회 기간', '선거 기간', '국정감사 기간'], '국가 비상사태');
sa('C', '기본권을 제한할 때 지켜야 할 조건 3가지를 쓰시오.',
  '목적과 수단이 적절해야 하고, 최소한에 그쳐야 하며, 본질적 내용을 침해할 수 없다.',
  { all: ['목적', '최소', '본질'] });
mc('C', '기본권을 제한하더라도 침해해서는 안 되는 것은?',
  ['기본권의 본질적 내용', '공공복리', '질서 유지', '국가 안전 보장'], '기본권의 본질적 내용');
sa('C', '과잉 금지의 원칙이란?',
  '기본권 제한 시 공익(피해를 최소화하며 보호하는 것)과 사익(제한되는 것)이 균형을 이루어야 한다는 원칙',
  { any: ['균형', '최소'] });
mc('C', '기본권 제한이 목적에 비해 지나치지 않고 최소한에 그쳐야 한다는 원칙은?',
  ['과잉 금지의 원칙', '무죄 추정의 원칙', '적법 절차의 원칙', '불이익 변경 금지의 원칙'],
  '과잉 금지의 원칙', '', true);
mc('C', '정부가 법률의 근거 없이 시행령만으로 국민의 자유를 제한했다. 어떤 점이 문제인가?',
  ['기본권 제한은 국회가 제정한 법률로 해야 한다', '시행령은 항상 효력이 없다', '자유권은 제한할 수 없다', '정부는 기본권을 제한할 권한이 없다'],
  '기본권 제한은 국회가 제정한 법률로 해야 한다');

/* ===== B. 기본권의 종류 ===== */
const SUBS = {
  '자유권': ['신체의 자유', '정신적 자유', '사회·경제적 자유'],
  '참정권': ['선거권', '공무담임권', '국민투표권'],
  '청구권': ['재판청구권', '국가배상청구권', '형사보상청구권', '청원권'],
  '사회권': ['근로의 권리', '교육을 받을 권리', '환경권', '사회보장수급권'],
  '평등권': ['평등권 침해', '실질적 평등을 위한 합리적 차별', '기회의 실질적 균등']
};
function rightCase(right, text, sub, exp) {
  const steps = [
    st('다음 사례에 해당하는 기본권은?\n' + text, R6, right, true),
    st('이 기본권의 특징은?', FEAT_LIST, FEAT[right], true)
  ];
  if (sub) steps.push(st('이 사례는 구체적으로 무엇에 해당하는가?', SUBS[right], sub, true));
  chain('B', steps, exp || ('정답: ' + right + (sub ? ' (' + sub + ')' : '')));
}
rightCase('행복추구권', '안전띠 착용 의무화에 대해 "착용 여부는 자율적으로 선택해야 한다"고 주장한다.', null, '자기결정권. 인간으로서의 존엄과 가치 및 행복 추구권');
rightCase('행복추구권', '심야 시간 청소년 게임 이용을 제한하는 셧다운제가 기본권을 침해한다고 주장한다.');

  function openQ() {
    const q = S.list[S.i];
    S.cur = { steps: [newRec(q.steps[0])], counted: false };
    renderQ();
  }
  function isLast() {
    const q = S.list[S.i], c = S.cur;
    return c.steps.length === q.steps.length && c.steps[c.steps.length - 1].done;
  }
  function finalize() {
    if (!isLast()) return;
    const q = S.list[S.i];
    const ok = S.cur.steps.every(r => r.ok);
    const prev = P.log[q.id];
    const n = (prev ? prev.n : 0) + (S.cur.counted ? 0 : 1);
    S.cur.counted = true;
    P.log[q.id] = { c: ok, n };
    S.res[q.id] = ok;
    save();
  }
  function judge(step, t) {
    const n = norm(t);
    if (!n) return false;
    if (step.all) return step.all.every(k => n.includes(norm(k)));
    if (step.any) return step.any.some(k => n.includes(norm(k)));
    return n === norm(step.ans);
  }
  function stepHtml(step, rec, k) {
    let h = `<div class="step"><p class="q">${esc(step.q)}</p>`;
    if (step.t === 'mc') {
      const two = rec.opts.length >= 4 && rec.opts.every(o => o.length <= 16);
      h += `<div class="opts ${two ? 'two' : ''}">` + rec.opts.map((o, i) => {
        let cls = '', tag = '';
        if (rec.done) {
          if (o === step.ans) { cls = 'good'; tag = '✓ 정답'; }
          else if (i === rec.pick) { cls = 'bad'; tag = '✗ 내 선택'; }
        }
        return `<button class="opt ${cls}" data-act="pick" data-k="${k}" data-i="${i}" ${rec.done ? 'disabled' : ''}><span>${CIRC[i]}</span><span>${esc(o)}</span><span class="tag">${tag}</span></button>`;
      }).join('') + '</div>';
    } else if (!rec.done) {
      h += `<input class="ans-in" id="ans" type="text" placeholder="정답을 입력하세요" autocomplete="off" value="${esc(rec.typed)}">
        <div class="row"><button class="btn primary" data-act="check" data-k="${k}">확인</button><button class="btn" data-act="reveal" data-k="${k}">모르겠어요</button></div>
        <p class="hint">핵심 단어가 들어 있으면 정답으로 인정합니다.</p>`;
    } else {
      h += `<div class="fb ${rec.ok ? 'good' : 'bad'}"><b>${rec.ok ? '✓ 정답' : '✗ 오답'}${rec.over ? ' (직접 정답 처리)' : ''}</b>
        <span class="v">내 답: ${esc(rec.typed || '(입력 없음)')}</span><span class="v">정답: ${esc(step.ans)}</span></div>`;
      if (!rec.ok && rec.typed) h += `<div class="row"><button class="btn" data-act="override" data-k="${k}">내 답도 맞아요</button></div>`;
    }
    return h + '</div>';
  }
  function renderQ() {
    view = 'quiz';
    const q = S.list[S.i], n = S.list.length, last = isLast();
    let h = `<div class="top"><button class="linkbtn" data-act="home">← 처음으로</button><span class="label">${S.mode === 'wrong' ? '오답노트' : '퀴즈'}</span></div>
      <div class="prog"><i style="width:${(S.i + (last ? 1 : 0)) / n * 100}%"></i></div>
      <div class="qcard"><div class="qmeta"><b>문 ${S.i + 1} / ${n}</b><span>${esc(CH[q.ch])}</span></div>`;
    S.cur.steps.forEach((rec, k) => { h += stepHtml(q.steps[k], rec, k); });
    if (last) {
      const ok = S.cur.steps.every(r => r.ok);
      if (q.steps.length > 1) h += `<div class="fb ${ok ? 'good' : 'bad'}"><b>${ok ? '✓ 모두 맞혔습니다' : '✗ 틀린 단계가 있습니다'}</b></div>`;
      if (q.exp) h += `<div class="note">${esc(q.exp)}</div>`;
      h += `<div class="row"><button class="btn primary" data-act="next">${S.i + 1 < n ? '다음 문제' : '결과 보기'}</button></div>`;
    }
    h += '</div>';
    app.innerHTML = h;
    const inp = document.getElementById('ans');
    if (inp) inp.focus({ preventScroll: true });
  }
  function stepDone(k) {
    const q = S.list[S.i];
    if (k + 1 < q.steps.length) S.cur.steps.push(newRec(q.steps[k + 1]));
    finalize();
    renderQ();
  }
  function pick(k, i) {
    const q = S.list[S.i], rec = S.cur.steps[k], step = q.steps[k];
    if (!rec || rec.done) return;
    rec.pick = i; rec.done = true; rec.ok = rec.opts[i] === step.ans;
    stepDone(k);
  }
  function check(k, reveal) {
    const q = S.list[S.i], rec = S.cur.steps[k], step = q.steps[k];
    if (!rec || rec.done) return;
    const inp = document.getElementById('ans');
    rec.typed = reveal ? '' : (inp ? inp.value.trim() : '');
    rec.reveal = !!reveal;
    rec.ok = reveal ? false : judge(step, rec.typed);
    rec.done = true;
    stepDone(k);
  }
  function override(k) {
    const rec = S.cur.steps[k];
    rec.ok = true; rec.over = true;
    finalize(); renderQ();
  }
  function next() {
    if (S.i + 1 < S.list.length) { S.i++; openQ(); } else result();
  }
  function result() {
    view = 'result';
    const n = S.list.length;
    const wr = S.list.filter(q => !S.res[q.id]);
    const ok = n - wr.length;
    const rows = wr.map(q => `<div class="wr"><div class="wq">${esc(q.steps[0].q)}</div><div class="wa">정답: ${esc(q.steps.map(s => s.ans).join(' → '))}</div></div>`).join('');
    app.innerHTML = `<div class="top"><span class="label">결과</span></div>
      <div class="qcard"><div class="big">${ok} / ${n}</div>
      <p class="sub">정답률 ${Math.round(ok / n * 100)}% · 틀린 문제 ${wr.length}개</p>
      <div class="row">${wr.length ? '<button class="btn primary" data-act="retry">틀린 문제만 다시 풀기</button>' : ''}<button class="btn" data-act="home">처음으로</button></div></div>
      ${wr.length ? `<div class="panel"><div class="panel-h"><span class="label">틀린 문제와 정답</span></div>${rows}</div>` : ''}`;
  }

  function startCards() {
    const sel = selected();
    const list = shuffle(Q.filter(q => sel.includes(q.ch)));
    if (!list.length) return;
    C = { list, i: 0, back: false };
    renderCard();
  }
  function renderCard() {
    view = 'cards';
    const q = C.list[C.i], n = C.list.length;
    const front = q.steps[0].q;
    const back = q.steps.map(s => s.ans).join(' → ') + (q.exp ? '\n\n' + q.exp : '');
    app.innerHTML = `<div class="top"><button class="linkbtn" data-act="home">← 처음으로</button><span class="label">암기카드</span></div>
      <div class="prog"><i style="width:${(C.i + 1) / n * 100}%"></i></div>
      <button class="flip ${C.back ? 'back' : ''}" data-act="flip"><span class="side">${C.back ? '정답' : '문제'} · ${C.i + 1} / ${n} · ${esc(CH[q.ch])}</span><span class="txt">${esc(C.back ? back : front)}</span></button>
      <div class="row">
        <button class="btn" data-act="cprev" ${C.i === 0 ? 'disabled' : ''}>이전</button>
        ${C.back
          ? '<button class="btn primary" data-act="cknow">알았어요</button><button class="btn" data-act="cunsure">헷갈려요</button>'
          : '<button class="btn primary" data-act="flip">정답 보기</button>'}
      </div>
      <p class="hint">헷갈려요를 누르면 오답노트에 담깁니다.</p>`;
  }
  function cardNext() {
    if (C.i + 1 < C.list.length) { C.i++; C.back = false; renderCard(); } else home();
  }

  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act, k = +b.dataset.k;
    if (a === 'home') home();
    else if (a === 'all') { P.sel = Object.keys(CH); save(); home(); }
    else if (a === 'start') {
      const n = +document.getElementById('n').value;
      let list = shuffle(Q.filter(q => selected().includes(q.ch)));
      if (n) list = list.slice(0, n);
      start(list, 'all');
    }
    else if (a === 'startwrong') start(shuffle(wrongList()), 'wrong');
    else if (a === 'cards') startCards();
    else if (a === 'pick') pick(k, +b.dataset.i);
    else if (a === 'check') check(k, false);
    else if (a === 'reveal') check(k, true);
    else if (a === 'override') override(k);
    else if (a === 'next') next();
    else if (a === 'retry') start(shuffle(S.list.filter(q => !S.res[q.id])), 'wrong');
    else if (a === 'flip') { C.back = !C.back; renderCard(); }
    else if (a === 'cprev') { if (C.i > 0) { C.i--; C.back = false; renderCard(); } }
    else if (a === 'cknow') cardNext();
    else if (a === 'cunsure') { const q = C.list[C.i]; const p = P.log[q.id]; P.log[q.id] = { c: false, n: p ? p.n : 0 }; save(); cardNext(); }
  });
  app.addEventListener('change', e => {
    if (e.target.dataset && e.target.dataset.ch) {
      P.sel = Array.from(app.querySelectorAll('input[data-ch]:checked')).map(x => x.dataset.ch);
      save();
    } else if (e.target.id === 'n') { P.n = e.target.value; save(); }
  });
  document.addEventListener('keydown', e => {
    if (view !== 'quiz') return;
    const inInput = e.target && e.target.id === 'ans';
    if (e.key === 'Enter') {
      if (inInput) { e.preventDefault(); check(S.cur.steps.length - 1, false); }
      else if (isLast() && !(e.target.closest && e.target.closest('button'))) { e.preventDefault(); next(); }
      return;
    }
    if (inInput || e.target.tagName === 'SELECT') return;
    const d = parseInt(e.key, 10);
    if (d >= 1 && d <= 6 && !isLast()) {
      const k = S.cur.steps.length - 1, rec = S.cur.steps[k];
      if (S.list[S.i].steps[k].t === 'mc' && !rec.done && d <= rec.opts.length) pick(k, d - 1);
    }
  });

  home();
})();
</script></body></html>
